name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies with Pipenv
        run: |
          pip install pipenv
          pipenv install --system --deploy

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force