site_name: GUIA DE ACESSIBILIDADE 

theme:
  name: material
  language: pt-BR
  logo: imagens/acessibilidade_logo.png
  favicon: imagens/acessibilidade_icon.png
  palette:
    - scheme: default
      primary: blue
      accent: green
      toggle:
        icon: material/weather-night
        name: Alterar para o modo escuro

    - scheme: slate
      primary: blue
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Alterar para modo claro
  features:
    - content.code.copy
    - navigation.tabs
    - toc.integrate
    - navigation.top

copyright: |
  <strong>IHC 2026.2 | GRUPO 06</strong> — Universidade de Brasília (UnB/FGA) | Docente: Profª. Rejane Maria da Costa Figueiredo


nav:
  - Início: index.md
  - Site avaliado:
    - sobre_o_site/brb_mobilidade.md
  - Perceptível:
    - tg09_acessibilidade/perceptivel  
  - Operável:
    - tg09_acessibilidade/operavel
  - Robusto:
    - tg09_acessibilidade/robusto 
  - Heurísticas:
    - tg09_acessibilidade/heuristicas
  - Ferramentas:
    - tg09_acessibilidade/testes_ferramentas

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true